name: Release MSIX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build signed MSIX package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\artifacts\installer\Build-Kiary-Installer.ps1

      - name: Create release bundle zip
        shell: pwsh
        run: |
          $packageDir = Get-ChildItem artifacts/installer/msix -Directory | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1
          if (-not $packageDir) {
            throw "No package directory found under artifacts/installer/msix."
          }

          $zipPath = "artifacts/Kiary-Installer-win-x64.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "$($packageDir.FullName)\*" -DestinationPath $zipPath -Force

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/installer/msix/**/*.msix
            artifacts/installer/msix/**/*.cer
            artifacts/installer/Install-Kiary.ps1
            artifacts/installer/README.txt
            artifacts/Kiary-Installer-win-x64.zip
